[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-issues-cli"
version = "1.0.0"
description = "Download the issues of a GitHub repository to markdown files via the gh CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-timeout==2.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
markers = ["live: hits the real GitHub through gh; opt-in only"]
# per-test limit, below the Tickets Watcher 540 s test command limit
timeout = 120
